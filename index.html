<style>
:root{--ink:#262626;--panel:#FFFFFF;--panel-2:#FAFAFA;--red:#0095F6;--red-dim:#1877F2;--gold:#ED4956;--green:#3F9142;--mut:#8e8e8e;--line:rgba(0,0,0,0.09)}
@media(prefers-color-scheme:dark){:root{--ink:#f5f5f5;--panel:#121212;--panel-2:#000;--red:#4db5ff;--red-dim:#4db5ff;--mut:#a8a8a8;--line:rgba(255,255,255,0.14);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--panel-2);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:0 0 76px}
.board{width:100%;max-width:560px;background:var(--panel);min-height:100vh;box-shadow:0 0 24px rgba(0,0,0,0.06)}
.header{background:var(--panel);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:10px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;font-weight:700}
.title{font-weight:800;font-size:19px;letter-spacing:.01em;background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF,#515BD4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.gate{text-align:right}.gate .label{font-size:9px;letter-spacing:.1em;color:var(--mut);font-weight:700}.gate .val{font-size:12px;font-weight:800}
.card{padding:22px 20px;border-bottom:1px solid var(--line);position:relative}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--red);padding:4px 10px;border-radius:100px;margin-bottom:12px}
.q{font-size:13px;color:var(--red-dim);margin-bottom:6px;font-weight:700}
.big{font-size:23px;font-weight:700;line-height:1.35;margin:0 0 16px}
.m{color:var(--mut);font-size:13px;margin:8px 0 0;font-weight:600}
.opt{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:13px 16px;border-radius:10px;font:600 14.5px 'Nunito',sans-serif;cursor:pointer;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.opt:active{transform:scale(.99)}
.opt .letter{font-size:12px;font-weight:800;color:var(--red-dim);border:1px solid var(--line);border-radius:6px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt.pri{border-color:var(--red);background:var(--red);color:#fff}.opt.pri .letter{color:#fff;border-color:rgba(255,255,255,.5)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:26px;font-weight:800}.stat span{font-size:12px;color:var(--mut);font-weight:700}
.stat.bad b{color:var(--gold)}.stat.ok b{color:var(--green)}
.warn{border:1px solid var(--gold);background:rgba(237,73,86,.1);color:var(--gold);border-radius:10px;padding:12px 14px;margin:0 0 14px;font-weight:700;font-size:13.5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px}
.chips button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:100px;padding:6px 12px;font:700 12px 'Nunito',sans-serif;cursor:pointer}
.chips button.on{background:var(--red);border-color:var(--red);color:#fff}
input[type=search]{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:600 16px 'Nunito',sans-serif;margin:0 0 10px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}td:first-child{color:var(--mut);width:38px;font-weight:700}
td:nth-child(2){font-weight:700}a{color:var(--red);white-space:nowrap;font-weight:700;text-decoration:none}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;padding:6px 0;border-bottom:1px solid var(--line)}.row b{color:var(--red-dim)}
.it{padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}.it b{font-size:13px;word-break:break-all}
mark{background:#ffe066;color:#000}
#vw{position:fixed;inset:0;background:var(--panel);z-index:40;overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 16px 24px}
#vw pre{white-space:pre-wrap;word-break:break-word;font:500 13px/1.55 'Nunito',sans-serif}
.ig-tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;justify-content:space-around;background:var(--panel);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.ig-tab{background:none;border:none;cursor:pointer;padding:6px 10px;display:flex;color:var(--ink);opacity:.55;transition:opacity .15s,transform .1s}
.ig-tab svg{width:24px;height:24px}.ig-tab:active{transform:scale(.9)}.ig-tab.active{opacity:1;color:var(--red)}
.gd-sec{padding:14px 0 4px;border-top:1px solid var(--line);margin-top:12px}.gd-sec:first-of-type{border-top:0;margin-top:0}
.gd-h{display:flex;justify-content:space-between;align-items:center;gap:8px}.gd-h b{font-size:15px;font-weight:800}
.gd-d{font-size:12px;color:var(--mut);font-weight:600;margin:2px 0 6px}
.gd-i{display:flex;align-items:center;gap:12px;padding:9px 2px;font-size:14.5px;font-weight:600;cursor:pointer}
.gd-i input{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:2px solid var(--mut);border-radius:50%;margin:0;flex-shrink:0;display:grid;place-content:center;cursor:pointer}
.gd-i input:checked{background:var(--red);border-color:var(--red)}.gd-i input:checked::after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.gd-b{font-size:10px;font-weight:800;padding:3px 8px;border-radius:100px;white-space:nowrap}.gd-b.y{background:rgba(63,145,66,.15);color:var(--green)}.gd-b.n{background:rgba(237,73,86,.12);color:var(--gold)}
.gd-bar{display:flex;gap:10px;margin-top:16px}.gd-bar .opt{margin:0;justify-content:center}
.gd-lnk{font-size:12px;color:var(--mut);font-weight:700;margin:0 0 12px}
.iglogo{width:32px;height:32px;border-radius:8px;margin-right:10px;flex-shrink:0}.brand{margin-right:auto}
.bd{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;color:#fff;flex-shrink:0;font-style:normal}.bd svg{width:19px;height:19px}
.bd.sm{width:24px;height:24px;border-radius:7px}.bd.sm svg{width:14px;height:14px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.ci{display:grid;grid-template-columns:34px 1fr;column-gap:10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px;font:700 13px 'Nunito',sans-serif;cursor:pointer}
.ci .bd{grid-row:span 2}.ci small{font-size:11px;color:var(--mut);font-weight:700}.ci:active{transform:scale(.98)}.ci.off{opacity:.45}
.bk{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--red);font:800 13px 'Nunito',sans-serif;padding:0;cursor:pointer}.bk svg{width:18px;height:18px}
.opt svg{width:14px;height:14px}
.apc-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}.apc-top img{width:64px;height:64px;border-radius:16px;flex-shrink:0}.apc-top b{font-size:17px;font-weight:800;display:block}
[hidden]{display:none!important}
</style>
</head>

function norm(n){

  if(i>-1)return a.slice(i).join('/');
  return a[a.length-1]==='start_here.html'?'start_here.html':a.join('/');

async function load(f){
  if(typeof JSZip==='undefined'){msg='Library ZIP gagal dimuat. Muat ulang halaman.';return rHome()}
  msg='Membaca ZIP…';rHome();
  try{
    const z=await JSZip.loadAsync(f);
    F={};ALL=[];T={};
    for(const [n,en] of Object.entries(z.files)){
      if(en.dir)continue;
      const p=norm(n);ALL.push(p);
      if(/\.(html|json)$/i.test(p)){
        let s=await en.async('string');
        if(isJ(p)){try{s=decodeURIComponent(escape(s))}catch(_){}}
        F[p]=s;
      }
    }
    analyze();
    msg=ALL.length+' file terbaca ('+Object.keys(F).length+' file teks).';

  }catch(err){msg='Gagal membaca ZIP: '+err.message}

}
function users(p,s){
  if(isJ(p)){
    try{
      const j=JSON.parse(s),a=Array.isArray(j)?j:Object.values(j).flat();
      return a.map(o=>o.title||(o.string_list_data&&o.string_list_data[0]&&(o.string_list_data[0].value||(o.string_list_data[0].href||'').split('/').pop()))).filter(Boolean);
    }catch(e){return[]}
  }
  const h=names(s);if(h.length)return h;
  return[...s.matchAll(/href="https:\/\/www\.instagram\.com\/(?:_u\/)?([^"\/?]+)"/g)].map(m=>m[1]);

      flat='/'+(dirs.concat([base]).join('/')).replace(/[^a-z0-9/]/g,'');
    let hit='Lainnya';
    for(const n of g.i){
      if(IM[n][1].some(k=>k==='*'||(k[0]==='='?dirs.includes(k.slice(1)):k[0]==='#'?base.includes(k.slice(1)):flat.includes(k)))){hit=n;break}
    }
    (o.m[g.k+'|'+hit]=o.m[g.k+'|'+hit]||[]).push(p);
  }
  return CI=o;
}
function leaf(v,k,out){
  if(v==null)return;
  if(typeof v==='object'){
    if(!Array.isArray(v)&&typeof v.label==='string'&&'value' in v&&typeof v.value!=='object'){out.push(v.label+': '+v.value);return}
    if(!Array.isArray(v)&&'value' in v&&typeof v.value!=='object'&&k&&!/^\d+$/.test(k)&&v.value!==''){out.push(k+': '+v.value);for(const [kk,vv] of Object.entries(v))if(kk!=='value'&&kk!=='href')leaf(vv,kk,out);return}
    for(const [kk,vv] of Object.entries(v))leaf(vv,kk,out);return;
  }
  let s=String(v);
  if(typeof v==='number'&&/timestamp/i.test(k)&&v>1e8)s=new Date(v*(v<1e11?1000:1)).toLocaleString('id-ID');
  if(s.trim())out.push(s);
}
function rowsOf(p){
  const s=F[p];
  if(isJ(p)){
    try{
      const j=JSON.parse(s);let a=Array.isArray(j)?j:Object.values(j).flat();
      if(!a.length)a=[j];
      return a.map(o=>{const out=[];leaf(o,'',out);return out.join(' · ')}).filter(Boolean);
    }catch(e){return[strip(s)]}
  }
  return dec(s.replace(/<(script|style)[\s\S]*?<\/\1>/gi,' ').replace(/<\/(div|tr|h2|p|li)>|<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,' ')).split('\n').map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
}
function itemRows(k){const ix=catIdx();return ix.rc[k]||(ix.rc[k]=(ix.m[k]||[]).flatMap(p=>rowsOf(p).map(t=>({f:p,t}))))}
function keyLabel(k){const [gk,n]=k.split('|'),g=GD.find(z=>z.k===gk);return[g?g.t:'Folder lain',n==='Lainnya'||!g?(g?g.t+' (lainnya)':n):n]}
function dlFile(name,mime,data){
  const u=URL.createObjectURL(new Blob([data],{type:mime})),a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);
}
const cq=v=>'"'+String(v).replace(/"/g,'""')+'"';
const csvOf=l=>'\ufeff'+['Kategori,Item,File,Isi'].concat(l.map(r=>r.map(cq).join(','))).join('\r\n');
const slug=v=>v.replace(/[^a-z0-9]+/gi,'_').replace(/^_|_$/g,'').toLowerCase();
const hl=t=>{let h=esc(t.slice(0,300)),q=q3.trim();if(q)h=h.replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>'<mark>'+m+'</mark>');return h};

function rCat(){
  if(!D){$('#body').innerHTML=NEED;return}
  if(csel)return rCatItem();
  const ix=catIdx();
  const card=(gi,ic,title,desc,items)=>`<div class="card"><b style="display:flex;align-items:center;gap:8px;font-size:15px">${badge(gi,ic)}${esc(title)}</b><div class="gd-d" style="margin-top:6px">${esc(desc)}</div><div class="cg">`+
    items.map(([k,n,ico])=>{const c=(ix.m[k]||[]).length;return `<button class="ci${c?'':' off'}" data-k="${esc(k)}">${badge(gi,ico)}<span>${esc(n)}</span><small>${c} file</small></button>`}).join('')+'</div></div>';
  $('#body').innerHTML=`<div class="card"><span class="tag">Kategori</span><p class="m" style="margin:0 0 12px">Pilih satu kategori untuk mencari isinya, lalu unduh hasilnya.</p>
   <button class="opt pri" id="dlall"><span class="letter">${svg('dl')}</span>Unduh semua kategori (CSV)</button></div>`+
   GD.map((g,gi)=>card(gi,GI[g.k],g.t,g.d,g.i.concat(ix.m[g.k+'|Lainnya']?['Lainnya']:[]).map(n=>[g.k+'|'+n,n,n==='Lainnya'?'folder':IM[n][0]]))).join('')+
   (ix.tops.length?card(7,'folder','Folder lain','File di luar kategori ekspor di atas',ix.tops.map(t=>['zz|'+t,t,'folder'])):'');
  document.querySelectorAll('.ci').forEach(b=>b.onclick=()=>{csel=b.dataset.k;q3='';window.scrollTo(0,0);rCat()});
  $('#dlall').onclick=()=>{
    const l=[];for(const k of Object.keys(ix.m)){const [g,n]=keyLabel(k);itemRows(k).forEach(r=>l.push([g,n,r.f,r.t]))}
    if(!l.length)return alert('Tidak ada data untuk diunduh.');
    dlFile('instagram_semua_kategori.csv','text/csv;charset=utf-8',csvOf(l));
  };
}
function filt3(){const q=q3.trim().toLowerCase();return itemRows(csel).filter(r=>!q||r.t.toLowerCase().includes(q)||r.f.toLowerCase().includes(q))}
function rCatItem(){
  const [gk,n]=csel.split('|'),g=GD.find(z=>z.k===gk),gi=g?GD.indexOf(g):7,ic=(IM[n]&&IM[n][0])||'folder',lb=keyLabel(csel);
  $('#body').innerHTML=`<div class="card"><button class="bk" id="kb">${svg('back')}Semua kategori</button>
   <b style="display:flex;align-items:center;gap:10px;margin:12px 0 12px;font-size:17px">${badge(gi,ic)}<span>${esc(lb[1])}<br><small class="m" style="margin:0">${esc(lb[0])}</small></span></b>
   <input type="search" id="s3" placeholder="Cari di ${esc(lb[1])}…" value="${esc(q3)}">
   <div class="gd-bar" style="margin:0 0 10px"><button class="opt" id="d1"><span class="letter">${svg('dl')}</span>CSV</button><button class="opt" id="d2"><span class="letter">${svg('dl')}</span>TXT</button></div><div id="res3"></div></div>`;
  $('#kb').onclick=()=>{csel=null;window.scrollTo(0,0);rCat()};

  $('#d1').onclick=()=>{const r=filt3();if(!r.length)return alert('Tidak ada data untuk diunduh.');dlFile(nm()+'.csv','text/csv;charset=utf-8',csvOf(r.map(x=>[lb[0],lb[1],x.f,x.t])))};
  $('#d2').onclick=()=>{const r=filt3();if(!r.length)return alert('Tidak ada data untuk diunduh.');dlFile(nm()+'.txt','text/plain;charset=utf-8',lb[1]+' ('+r.length+' entri)\r\n\r\n'+r.map((x,i)=>(i+1)+'. '+x.t+'\r\n   ['+x.f+']').join('\r\n'))};
  rc3();
}
function rc3(){
  const r=filt3(),all=itemRows(csel).length;
  $('#res3').innerHTML=all?`<p class="m" style="margin:0 0 4px">${r.length}${q3.trim()?' dari '+all:''} entri</p>`+

  document.querySelectorAll('#res3 .it').forEach(d=>d.onclick=()=>{LIST=[d.dataset.f];const sv=q2;q2=q3;view(0);q2=sv});
